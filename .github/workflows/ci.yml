# CI 流水线:Linux(完整门禁) + Windows(编译/链接门禁) + macOS(编译/链接门禁)
#
# 仓库结构(2026-10-12 目录定案,详见 AGENTS.md):
#   gui/        库模块 `NoahLiu/native-gui`(13 个包)——moon.work 成员,也是发布单元
#   examples/   独立示例模块 `NoahLiu/native-gui-examples`
#   experiment/ 独立探针/微基准模块 `NoahLiu/native-gui-experiment`
#   modules/    媒体(gui-media)、布局(yoga-mbt)、ffmpeg-mbt、扩展示例等独立模块
#
# 门禁口径(AGENTS.md 规则 6):库门禁一律在 `gui/` 下按包路径限定。裸 `moon test`
# 在 workspace 里会连带示例/探针/媒体模块(其中含既有的平台适配缺口),不作库门禁。
#
# 平台:Windows ✅ / Linux ✅(X11 + GTK3,当前主链路) / macOS 🚧 后端落地中
#   (gui/win/stub.c 的 WM_STUB_MAC 分支是 Cocoa 真实现,由 mac 平台批逐族补齐;
#   macOS job 只验「编得过、链得上」——runner 无窗口服务会话,视觉与交互验证
#   按 AGENTS 规则 6 由使用者在真机做,批次口径见 TODO.md 的「mac 平台批」一节)。
#
# 链接参数由 `gui/scripts/prebuild.py`(`gui/moon.mod` 的 prebuild 钩子)按当前
# 系统生成并传播;prebuild 只能给自己模块内的包下发配置(moon 拒绝外部包名),
# 示例/探针模块构建时自动继承库模块的链接参数,故本文件不写任何链接配置。

name: CI


on:
  push:
    branches: [master, mac]
  pull_request:

jobs:
  linux:
    name: Linux(静态检查 + 测试 + 构建 + xvfb 冒烟)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖(GTK3/Pango/X11/WebKit 开发包 + xvfb + dbus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libpango1.0-dev libfontconfig1-dev libx11-dev \
            libwebkit2gtk-4.1-dev \
            xvfb dbus

      - name: 安装 moon 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 新装 runner 的注册表索引里查不到 prowk/moonsqlitefile 与 mizchi/markdown
      # （三平台同一个报错：module was not found in the registry），moon 自己
      # 也给出口令 `you may need to run moon update`——先刷索引再解析依赖图。
      - name: 刷新注册表索引
        run: moon update

      - name: 静态检查(库模块)
        working-directory: gui
        run: moon check

      # 13 个包全量;dbus 包走真实会话总线,CI 里由 dbus-run-session 提供
      # (runner 默认只有系统总线)。失败时把关键行塞进 error 注解
      # (匿名 API 可读),并回显输出尾部。
      - name: 单元测试(库模块,13 包)
        working-directory: gui
        run: |
          set +e
          dbus-run-session -- moon test \
            core ui render text theme icons sys input win dbus chart mdview web \
            >/tmp/mt.out 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error title=moon test 退出码 $code::$(grep -aiE 'failed|FAILED|error|panicked|expect' /tmp/mt.out | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            tail -c 4000 /tmp/mt.out
            exit 1
          fi
          grep -aE "Total tests" /tmp/mt.out | tail -1

      # 库模块全量构建 + hello 示例的 native 链接——后者顺带验证库模块
      # prebuild 的链接参数能传播到独立模块(示例模块自身不配 prebuild)。
      - name: 构建(库模块 + hello 示例)
        run: |
          set +e
          (cd gui && moon build --target native) >/tmp/mb.out 2>&1; c1=$?
          moon build examples/hello --target native >>/tmp/mb.out 2>&1; c2=$?
          set -e
          if [ $c1 -ne 0 ] || [ $c2 -ne 0 ]; then
            echo "::error title=moon build 退出码 $c1/$c2::$(grep -aiE 'error|undefined|failed|ld: ' /tmp/mb.out | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

      # 冒烟判定:hello 是常驻事件循环,timeout 到期返回 124 = 进程存活 20 秒;
      # 启动崩溃/链接失败会以其他退出码失败。
      - name: GUI 冒烟(hello 在虚拟显示下存活 20 秒即通过)
        run: |
          set +e
          timeout 20s xvfb-run -a moon run examples/hello
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::冒烟失败,退出码 $code(预期 124 = GUI 进程存活到超时)"
            exit 1
          fi

  windows:
    name: Windows(静态检查 + 测试 + 链接)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 moon 工具链
        shell: pwsh
        run: |
          iwr https://cli.moonbitlang.com/install/powershell.ps1 -useb | iex
          echo "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      # gui/moon.mod 的 prebuild 钩子执行 `scripts/prebuild.py`,需要 python3
      # 命令;Windows runner 只有 python.exe——复制一份改名放进已入 PATH 的
      # ~/.moon/bin,后续步骤的 python3 即可解析。
      - name: 提供 python3 命令别名
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Copy-Item $py "$env:USERPROFILE\.moon\bin\python3.exe"

      - name: 刷新注册表索引(同 Linux job)
        shell: pwsh
        run: moon update

      # vcvars64 用 vswhere 定位(不依赖 VS 具体版本/Edition 路径):moon 的
      # native-stub 与 --target native 都要 cl.exe/链接器在 PATH 里。
      #
      # ffmpeg 运行库:gui-media / ffmpeg-mbt 的测试在 Windows 上做真解码
      # (vendor 进仓库的只有头文件与导入库,运行期 dll 不进仓库)。dll 从
      # BtbN lgpl-shared 构建取,与本地开发口径一致(见 docs/zh/adaptation.md);
      # 解出 bin 目录放进 PATH,moon test 的测试进程继承环境即能加载。
      # latest 标签的 n9.0 资产随上游滚动重建,内容键固定 9.0——缓存到重建
      # 之间上游若有 minor 变更,以首次缓存为准(可接受:测试只依赖 ABI 稳定的 9.x)。
      - name: 缓存 ffmpeg 运行库
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-bin
          key: ffmpeg-lgpl-shared-9.0-win64

      - name: 下载 ffmpeg 运行库
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg-lgpl.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg-x"
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-x" -Recurse -Directory -Filter bin |
            Where-Object { (Get-ChildItem $_.FullName -Filter "avcodec-*.dll").Count -gt 0 } |
            Select-Object -First 1
          if ($null -eq $bin) { throw "ffmpeg bin 目录未找到" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ffmpeg-bin" | Out-Null
          Copy-Item "$($bin.FullName)\*.dll" "$env:RUNNER_TEMP\ffmpeg-bin\"
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\ffmpeg-x", $zip

      - name: ffmpeg 运行库进 PATH
        shell: pwsh
        run: echo "$env:RUNNER_TEMP\ffmpeg-bin" >> $env:GITHUB_PATH

      # 测试清单的两处平台排除(既有 Windows 缺口,非库缺陷):
      #   dbus —— D-Bus 是 Linux 桌面基建,Windows 无会话总线,4 条总线用例必失败;
      #   sys  —— sys_make_dirs 走 `mkdir -p` 子进程(POSIX 语义),Windows 上不可用。
      # 这两包在 Linux job 里全量跑;此处按平台能力排除,恢复覆盖需专项批
      # (dbus 侧加平台跳过、sys 侧把 make_dirs 换成跨平台实现)。
      #
      # 媒体线(gui-media / ffmpeg-mbt)是真解码测试:exe 依赖 ffmpeg 运行库
      # dll(上一节放 PATH);非 Linux 平台的占位/跳过口径见各模块 prebuild。
      - name: 配置 MSVC 环境并检查/测试/构建
        shell: cmd
        run: >-
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath')
          do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          && cd gui
          && moon check
          && moon test core ui render text theme icons input win chart mdview web
          && moon build --target native
          && cd ..\modules\ffmpeg-mbt
          && moon test src
          && cd ..\gui-media
          && moon test media
          && cd ..\..
          && moon build examples/hello --target native

  macos:
    name: macOS(静态检查 + 测试 + 链接)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 moon 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # macOS 的原生层是 Objective-C(stub.c 的 WM_STUB_MAC 分支由 prebuild 带
      # -x objective-c 专编成静态库),链接器与 SDK 头由 runner 自带的 Xcode
      # Command Line Tools 提供,无需额外安装——这也是本 job 唯一的编译期依赖。
      # 起手把依赖的框架列出来:缺哪个就在日志里直说,不用等编译报错再猜。
      - name: 核对 SDK 框架齐备
        run: |
          xcrun --show-sdk-path
          sdk="$(xcrun --show-sdk-path)/System/Library/Frameworks"
          for f in Cocoa CoreGraphics CoreText ImageIO WebKit Carbon IOKit; do
            if [ ! -d "$sdk/$f.framework" ]; then
              echo "::error title=缺框架::$sdk/$f.framework 不存在"
              exit 1
            fi
          done
          echo "框架齐备: Cocoa/CoreGraphics/CoreText/ImageIO/WebKit/Carbon/IOKit"

      # 新装 runner 的注册表索引里查不到 prowk/moonsqlitefile 与 mizchi/markdown
      # (三平台同一个报错: module was not found in the registry),先刷索引。
      - name: 刷新注册表索引
        run: moon update

      - name: 静态检查(库模块)
        working-directory: gui
        run: moon check

      # 与 Windows job 同口径的平台排除:dbus 是 Linux 桌面基建,macOS 无会话总线。
      # 失败时把关键行塞进 error 注解(匿名 API 可读),并回显输出尾部。
      - name: 单元测试(库模块,12 包)
        working-directory: gui
        run: |
          set +e
          moon test \
            core ui render text theme icons sys input win chart mdview web \
            >/tmp/mt.out 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            echo "::error title=moon test 退出码 $code::$(grep -aiE 'failed|FAILED|error|panicked|expect' /tmp/mt.out | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            tail -c 4000 /tmp/mt.out
            exit 1
          fi
          grep -aE "Total tests" /tmp/mt.out | tail -1

      # 库模块全量构建 + hello 示例的 native 链接:后者顺带验证 prebuild 的
      # Darwin 分支下发的 framework 链接参数能传播到独立模块(示例模块不配 prebuild)。
      - name: 构建(库模块 + hello 示例)
        run: |
          set +e
          (cd gui && moon build --target native) >/tmp/mb.out 2>&1; c1=$?
          moon build examples/hello --target native >>/tmp/mb.out 2>&1; c2=$?
          set -e
          if [ $c1 -ne 0 ] || [ $c2 -ne 0 ]; then
            echo "::error title=moon build 退出码 $c1/$c2::$(grep -aiE 'error|undefined|failed|Undefined symbol|ld: ' /tmp/mb.out | tail -c 1800 | sed ':a;N;$!ba;s/\n/%0A/g')"
            tail -c 6000 /tmp/mb.out
            exit 1
          fi
