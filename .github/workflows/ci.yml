# CI 流水线:三平台(Linux + Windows + macOS)
#
# 链路与 AGENTS.md 规则 6 的提交门禁一致:
#   依赖装齐 → prepare.py 原生层(钉版本 libyue + CMake 静态库)
#   → moon check(零错误零警告)→ moon test(纯 MoonBit 单测)
#   → moon build --target native(全包构建 + 链接)
#   → Linux 侧 xvfb 虚拟显示跑 hello 冒烟(GUI 事件循环存活即通过)
#   - Windows / macOS 例外:仅到 moon check(链接期分别缺 ffmpeg 的 MSVC 库、
#     subproc 的 mac 支持与 libav 头文件路径,详见 docs/zh/adaptation.md)
#
# 说明:
# - Windows 默认不嵌应用清单(prebuild 按 moon 的链接参数拼接行为决定,
#   详见 docs/zh/adaptation.md 的 manifest 小节);发布型构建由
#   release-bin.yml 设 YUE_MBT_KEEP_MANIFEST=1 嵌入。
# - 链接参数由 scripts/prebuild.py(moon 构建钩子)按当前系统生成并传播,
#   workflow 不写任何链接配置;原生层产物缓存命中时 prepare.py 秒级返回。
# - Windows / macOS 不做运行冒烟(headless 会话不可靠:无窗口会话/
#   无 WindowServer),链接成功即强验证。
# - 冒烟判定:hello 是常驻事件循环,timeout 到期返回 124 = 进程存活 20 秒;
#   启动崩溃/链接失败会以其他退出码失败。
# - macOS 是本仓库首次实测该平台构建链(此前 macOS 分支"已备未实测"),
#   ARM64 Runner;libyue 的 mac 源码与 Cocoa 均架构无关。

name: CI


on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    name: Linux(构建 + 测试 + xvfb 冒烟)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖(GTK/webkit/X11 开发包 + ffmpeg 开发包 + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-3-dev libpango1.0-dev libfontconfig1-dev libx11-dev \
            libwebkit2gtk-4.1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev \
            xvfb

      - name: 安装 moon 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 全新 runner 上没有 registry 索引,moon 不会自动拉取——不先 moon update
      # 会以「module was not found in the registry」在 moon check 阶段失败
      # (本机正常是因为索引早已就位;moon update 只刷新索引,不改 moon.mod)。
      - name: 更新 registry 索引(moon update)
        run: moon update

      - name: 缓存原生层产物(build + vendor + 下载缓存)
        uses: actions/cache@v6
        with:
          path: |
            build
            vendor
            .prepare
          key: native-linux-${{ hashFiles('scripts/prepare.py', 'shim/**') }}

      - name: 构建原生层(钉版本下载 libyue + CMake 静态库)
        run: |
          python3 scripts/prepare.py
          # 诊断:链接回归排查——shim 库必须含近期新增符号,缺失即打印
          # 编译器/库成员详情后失败(注解匿名可读)
          if ! nm build/libyue_mbt.a | grep -q yue_mbt_view_set_bounds; then
            {
              echo "== 工具链 =="
              g++ --version | head -1
              cmake --version | head -1
              echo "== libyue_mbt.a 成员 =="
              ar t build/libyue_mbt.a
              echo "== 符号表规模 =="
              nm build/libyue_mbt.a | grep -c " T "
              echo "== yue_mbt.o 内 set_bounds =="
              nm build/CMakeFiles/yue_mbt.dir/yue_mbt.cpp.o 2>/dev/null | grep set_bounds || echo "对象文件中无此符号"
              echo "== CMakeCache 编译器 =="
              grep -E "CMAKE_CXX_COMPILER:|CMAKE_CXX_FLAGS" build/CMakeCache.txt
            } > /tmp/diag.out 2>&1
            echo "::error title=shim 缺符号::$(tail -c 1800 /tmp/diag.out | awk 'BEGIN{s=""}{printf "%s%s", s, $0; s="%0A"}')"
            exit 1
          fi

      # 三连拆开跑并捕获各退出码,失败命令各自把输出尾巴塞进 error
      # 注解(匿名 API 可读)——runner 环境差异导致的失败拿不到日志时定位用
      - name: 静态检查 + 单元测试 + 全量构建
        run: |
          set +e
          moon check >/tmp/mc.out 2>&1; c1=$?
          moon test >/tmp/mt.out 2>&1; c2=$?
          moon build --target native >/tmp/mb.out 2>&1; c3=$?
          set -e
          if [ $c1 -ne 0 ]; then
            echo "::error title=moon check 退出码 $c1::$(tail -c 2000 /tmp/mc.out | awk 'BEGIN{s=""}{printf "%s%s", s, $0; s="%0A"}')"
          fi
          if [ $c2 -ne 0 ]; then
            echo "::error title=moon test 退出码 $c2::$(grep -aiE 'failed|FAILED|error|panicked|expect' /tmp/mt.out | tail -c 1800 | awk 'BEGIN{s=""}{printf "%s%s", s, $0; s="%0A"}')"
          fi

          if [ $c3 -ne 0 ]; then
            echo "::error title=moon build 退出码 $c3::$(grep -aiE 'error|undefined|failed|ld: |warning: (ignoring|link)' /tmp/mb.out | tail -c 1800 | awk 'BEGIN{s=""}{printf "%s%s", s, $0; s="%0A"}')"
          fi
          [ "$c1$c2$c3" = "000" ]

      - name: GUI 冒烟(hello 在虚拟显示下存活 20 秒即通过)
        run: |
          set +e
          timeout 20s xvfb-run -a moon run examples/hello
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::冒烟失败,退出码 $code(预期 124 = GUI 进程存活到超时)"
            exit 1
          fi

  windows:
    name: Windows(MSVC 静态检查)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 moon 工具链
        shell: pwsh
        run: |
          iwr https://cli.moonbitlang.com/install/powershell.ps1 -useb | iex
          echo "$env:USERPROFILE\.moon\bin" >> $env:GITHUB_PATH

      # moon.mod.json 的 prebuild 钩子写死 `python3 scripts/prebuild.py`,
      # Windows runner 只有 python.exe——复制一份改名放进已入 PATH 的
      # ~/.moon/bin,后续步骤的 python3 命令即可解析。
      - name: 提供 python3 命令别名
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          Copy-Item $py "$env:USERPROFILE\.moon\bin\python3.exe"

      # 全新 runner 上没有 registry 索引,moon 不会自动拉取——不先 moon update
      # 会以「module was not found in the registry」在 moon check 阶段失败
      # (本机正常是因为索引早已就位;moon update 只刷新索引,不改 moon.mod)。
      - name: 更新 registry 索引(moon update)
        shell: pwsh
        run: moon update

      - name: 缓存原生层产物(build + vendor + 下载缓存)
        uses: actions/cache@v6
        with:
          path: |
            build
            vendor
            .prepare
          key: native-windows-${{ hashFiles('scripts/prepare.py', 'shim/**') }}

      # vcvars64 用 vswhere 定位(不依赖 VS 具体版本/ Edition 路径);
      # prepare.py 会自动从 NuGet 补 WebView2 头文件与 loader DLL。
      # Windows 仅到静态检查:ffmpeg-mbt 的 ffmpeg_stub.c 真调 libav,
      # Windows 没有 MSVC 库供货,moon test 的测试二进制与 moon build 的
      # systemprobe 链接都会报未定义符号;待 ffmpeg 的 MSVC 库方案
      # (NuGet/ShiftMediaProject 预编译,仿 WebView2 钉版本 + sha256 模式)
      # 落地后恢复 test/build(docs/zh/adaptation.md 有待办记录)
      - name: 构建原生层 + 静态检查(MSVC 环境)
        shell: cmd
        run: >-
          for /f "tokens=*" %%i in ('"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath')
          do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          && python scripts\prepare.py
          && moon check

  macos:
    name: macOS(静态检查)
    # 不用 macos-latest(现挂 Xcode 26/AppleClang 21):vendored 的
    # partition_alloc/id_map 头文件编不动(no_destructor.h/id_map.h 报错),
    # 需 Xcode 16 的 clang;首跑失败与修复记录见 docs/adaptation.md
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: 选用 Xcode 16(AppleClang 21 编不动 vendored 老头文件)
        run: |
          ls -d /Applications/Xcode*.app || true
          latest16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest16" ]; then
            echo "::error::镜像上没有 Xcode 16,请改用其他 macOS 镜像或给 libyue 打头文件补丁"
            exit 1
          fi
          sudo xcode-select -s "$latest16"
          clang++ --version

      - name: 安装 moon 工具链
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 全新 runner 上没有 registry 索引,moon 不会自动拉取——不先 moon update
      # 会以「module was not found in the registry」在 moon check 阶段失败
      # (本机正常是因为索引早已就位;moon update 只刷新索引,不改 moon.mod)。
      - name: 更新 registry 索引(moon update)
        run: moon update

      - name: 缓存原生层产物(build + vendor + 下载缓存)
        uses: actions/cache@v6
        with:
          path: |
            build
            vendor
            .prepare
          key: native-macos-${{ hashFiles('scripts/prepare.py', 'shim/**') }}

      # Xcode/CLT 与 CMake 为 Runner 自带;macOS 侧无 pkg-config 依赖
      # (prebuild 的 Darwin 分支直接给框架链接参数,不走 pkg-config)。
      - name: 构建原生层(钉版本下载 libyue + CMake 静态库)
        run: python3 scripts/prepare.py

      # macOS 仅静态检查:moon check 只做类型检查、不编译 native-stub 的 C
      # (本机探针实证:含 #error 的桩 check 照样过),而 moon test/build 的
      # 链接阶段有两道跨不过去的坎——① chensuiyi/subproc@0.3.0 的 native.c
      # 用 execvpe / SOCK_CLOEXEC / SYS_pidfd_open 等 Linux 专属 API,mac
      # 编不过(上游问题);② ffmpeg-mbt 的桩编译缺 libav 头文件路径(pkg-config
      # 的 --libs 只出链接参数,头文件要 CPATH=/opt/homebrew/include 或
      # prebuild 供 --cflags)。两者解决后恢复 test/build(TODO 有记录)。
      # 失败细节走 error 注解回传(awk 版多行合并,BSD/GNU 通用)。
      - name: 静态检查
        run: |
          set +e
          moon check >/tmp/mc.out 2>&1; c1=$?
          set -e
          if [ $c1 -ne 0 ]; then
            echo "::error title=moon check 退出码 $c1::$(tail -c 2000 /tmp/mc.out | awk 'BEGIN{s=""}{printf "%s%s", s, $0; s="%0A"}')"
          fi
          [ "$c1" = "0" ]

      # 三连失败时上传完整输出(artifact 匿名可下载),注解截断时兜底
      - name: 失败输出上传
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moon-outputs-macos
          path: |
            /tmp/mc.out
